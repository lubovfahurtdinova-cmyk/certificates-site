<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сертификат</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
  .card { background:#e46d3f; color:#fff; padding:40px 50px; border-radius:6px; box-shadow:0 8px 40px rgba(0,0,0,.5); text-align:left; max-width: 680px; width: 90%; }
  h1 { font-size:48px; margin:0 0 20px; letter-spacing:2px; }
  .name { font-size:40px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; margin-bottom:8px; }
  .sub { font-size:14px; opacity:.9; }
</style>
</head>
<body>
<div class="card">
  <div class="sub" style="font-size:14px; text-transform:uppercase; opacity:.9">СЕРТИФИКАТ</div>
  <div class="name" id="certName">КАРОЛИНА ИВАНОВА</div>
  <div class="sub" style="margin-top:8px; font-size:16px;">успешно окончила Практикум по полиграфии</div>
</div>
<script>
(function(){
  const p = new URLSearchParams(window.location.search);
  const nm = p.get('name');
  if (nm){
    const el = document.getElementById('certName');
    if (el) el.textContent = decodeURIComponent(nm);
  }
})();
</script>
</body>
</html>
